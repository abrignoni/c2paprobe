name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The versions the LEAPP runtime-contract CI runs, so the copies vendored
        # into the cores are proven on every interpreter those tools support.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the known-answer tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-output.txt
          if grep -qi "skipped" test-output.txt; then
            echo "::error::a test was skipped; every test must run on every version"
            exit 1
          fi

      - name: Install the package and run the console script
        shell: bash
        run: |
          python -m pip install .
          c2pareader --version
          python -c "import c2pareader, sys; sys.exit(0 if c2pareader.__version__ else 1)"
